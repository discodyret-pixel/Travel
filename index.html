<meta charset="utf-8">
<style>

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #wrap{max-width:1100px;margin:0 auto;padding:14px 16px 22px}
  h1{font-size:19px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 10px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:0 0 12px}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:5px}
  #stage{position:relative;background:var(--panel);border-radius:16px;overflow:hidden;border:1px solid #1d2c26}
  svg{display:block;width:100%;height:auto}
  .land{fill:var(--land);stroke:var(--land-line);stroke-width:.5}
  .arc{fill:none;stroke-width:1.8;opacity:.6;stroke-linecap:round}
  .arc.ret{stroke-dasharray:3 4;opacity:.42;stroke-width:1.4}
  .arc.old{opacity:.14;stroke-width:1}
  .pin{stroke:#0e1512;stroke-width:1.2}
  .pin.old{opacity:.7}
  .home{fill:var(--home);stroke:#0e1512;stroke-width:1.6}
  .plane{font-size:14px}
  .lbl{fill:var(--ink);font-size:12px;font-weight:600;paint-order:stroke;stroke:#0e1512;stroke-width:3px;stroke-linejoin:round}
  #hud{position:absolute;left:16px;top:12px;pointer-events:none}
  #year{font-size:60px;font-weight:800;line-height:.9;letter-spacing:-2px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  #place{font-size:15px;font-weight:600;margin-top:4px;min-height:20px;max-width:360px}
  #who{font-size:12px;font-weight:700;margin-top:3px;min-height:15px;letter-spacing:.3px}
  #stats{position:absolute;right:16px;top:14px;text-align:right;pointer-events:none}
  #stats b{font-size:24px;font-weight:800}#stats span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .statblock{margin-bottom:8px}
  #controls{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  button{background:var(--faelles);color:#04231a;border:0;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid #2a3f38}
  button:active{transform:translateY(1px)}
  #scrub{flex:1;min-width:180px;accent-color:var(--faelles)}
  #month{position:absolute;left:16px;bottom:14px;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.3px;pointer-events:none}
  #speed{background:transparent;color:var(--ink);border:1px solid #2a3f38;border-radius:8px;padding:7px 10px;font-size:13px}

  #co2box{position:absolute;right:14px;bottom:12px;display:flex;flex-direction:column;align-items:center;pointer-events:none}
  #iceberg{width:64px;height:64px}
  #co2num{text-align:center;margin-top:2px}
  #co2num b{font-size:17px;font-weight:800;color:#bfe9ff;display:block;line-height:1}
  #co2num span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .country-glow{fill:#5a9e7c;stroke:#7ec4a3;stroke-width:.5;filter:drop-shadow(0 0 1.5px rgba(143,224,182,.4))}
  .micro-glow{filter:drop-shadow(0 0 1px rgba(126,196,163,.5))}
  @media(max-width:640px){#year{font-size:42px}#stats b{font-size:18px}#place{max-width:210px}#co2box{transform:scale(.8);right:4px}}
</style>

 ""], ["Belize", -88.19, 17.5, "Belize", ""], ["Cozumel", -86.95, 20.42, "Mexico", ""]]}, {"y": 2026, "m": "Påske", "hvem": "Fælles", "name": "Berlin", "stops": [["Berlin", 13.4, 52.52, "Tyskland", ""]]}, {"y": 2026, "m": "Påske", "hvem": "Fælles", "name": "Pietrasanta", "stops": [["Pietrasanta", 10.23, 43.96, "Italien", ""]]}, {"y": 2026, "m": "April", "hvem": "Fælles", "name": "Vietnam", "stops": [["HCM", 106.7, 10.82, "Vietnam", "Ja"], ["Hoi An", 108.34, 15.88, "Vietnam", "Ja"], ["Puh Quoc", 103.96, 10.28, "Vietnam", "Ja"]]}, {"y": 2026, "m": "Juli", "hvem": "Fælles", "name": "Tyskland → Frankrig → Spanien → Belgien", "stops": [["Berlin", 13.4, 52.52, "Tyskland", ""], ["Frankrig", 2.21, 46.23, "Frankrig", ""], ["San Sebastian", -1.98, 43.32, "Spanien", ""], ["Antwerpen", 4.4, 51.22, "Belgien", ""]]}];
function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||"#2fd39a";}
const COL={"Fælles":getCSS("--faelles"),"Jakob":getCSS("--jakob"),"Kristian":getCSS("--kristian")};
const svg=d3.select("#map"),W=960,H=500;
const proj=d3.geoNaturalEarth1().scale(180).translate([W/2,H/2+10]);
const path=d3.geoPath(proj);

window.__MICRO_DOTS={
  "Singapore":[103.82,1.35],"Hong Kong":[114.17,22.32],"Aruba":[-69.97,12.52],
  "Curaçao":[-68.99,12.17],"Gibraltar":[-5.35,36.14],"St. Maarten":[-63.05,18.03]
};
window.__NAME2NE={
"USA":"United States of America","Storbritannien":"United Kingdom","Rusland":"Russia",
"Emiraterne":"United Arab Emirates","Vatikanet":"Italy","Dominikanske Rep.":"Dominican Rep.",
"Sydafrika":"South Africa","Holland":"Netherlands",
"Grækenland":"Greece","Tyrkiet":"Turkey","Tyskland":"Germany","Østrig":"Austria",
"Spanien":"Spain","Frankrig":"France","Belgien":"Belgium","Italien":"Italy",
"Ungarn":"Hungary","Sverige":"Sweden","Norge":"Norway","Slovakiet":"Slovakia",
"Rumænien":"Romania","Cypern":"Cyprus","Egypten":"Egypt","Tunesien":"Tunisia",
"Indien":"India","Indonesien":"Indonesia","Thailand":"Thailand","Vietnam":"Vietnam",
"Cambodja":"Cambodia","Laos":"Laos","Malaysia":"Malaysia","Brunei":"Brunei",
"Filippinerne":"Philippines","Sri Lanka":"Sri Lanka",
"Kina":"China","Mexico":"Mexico","Honduras":"Honduras",
"Belize":"Belize","Haiti":"Haiti","Puerto Rico":"Puerto Rico","Georgien":"Georgia","Australien":"Australia","Afghanistan":"Afghanistan",
"Bulgarien":"Bulgaria"
};
window.__nameMatch=function(feat,visitedSet){
  const fname=feat.properties.name;
  for(const v of visitedSet){
    const mapped=window.__NAME2NE[v]||v;
    if(fname===mapped)return true;
  }
  return false;
};
const gLand=svg.append("g"),gGlow=svg.append("g"),gArc=svg.append("g"),gPin=svg.append("g"),gHome=svg.append("g"),gPlane=svg.append("g"),gLbl=svg.append("g");
const yearEl=document.getElementById("year"),placeEl=document.getElementById("place"),whoEl=document.getElementById("who"),monthEl=document.getElementById("month"),
  cTrips=document.getElementById("cTrips"),cCountries=document.getElementById("cCountries"),
  scrub=document.getElementById("scrub"),playBtn=document.getElementById("play"),restartBtn=document.getElementById("restart"),
  speedSel=document.getElementById("speed");
scrub.max=J.length-1;
let idx=0,playing=false,pending=null,SPD=0.6;
speedSel.onchange=()=>{SPD=+speedSel.value;};


const co2El=document.getElementById("cCO2");
const bergSvg=d3.select("#iceberg");
// CO2-faktor: gennemsnitlig flypassager ~0.15 kg CO2 pr. km (kort/mellemdistance-gennemsnit inkl. radiative forcing)
const CO2_PER_KM=0.15;
function legKm(from,to){return d3.geoDistance(from,to)*6371;}
function journeyKm(J0){
  let km=0,prev=HOME;
  J0.stops.forEach(st=>{km+=legKm(prev,[st[1],st[2]]);prev=[st[1],st[2]];});
  km+=legKm(prev,HOME);
  return km;
}
function co2UpTo(ji){let kg=0;for(let k=0;k<=ji;k++){kg+=journeyKm(J[k])*CO2_PER_KM;}return kg;}
function fmtCO2(kg){
  if(kg>=1000)return (kg/1000).toFixed(1).replace(".",",")+" t";
  return Math.round(kg).toLocaleString("da-DK");
}
function drawIceberg(frac){
  // frac: 0 = frisk isbjerg (intet CO2 endnu), 1 = helt smeltet (loft nået)
  bergSvg.selectAll("*").remove();
  const waterY=78;
  bergSvg.append("rect").attr("x",0).attr("y",waterY).attr("width",120).attr("height",42).attr("fill","#0b3a52").attr("opacity",.55);
  // isbjerg-form skrumper med frac
  const shrink=1-0.72*frac;
  const topY=18+ (1-shrink)*34;
  const w=46*shrink;
  const pts=[[60-w,waterY],[60-w*0.5,topY],[60+w*0.15,topY-6*shrink],[60+w*0.65,topY+8],[60+w,waterY]];
  const d="M"+pts.map(p=>p.join(",")).join(" L")+" Z";
  bergSvg.append("path").attr("d",d).attr("fill","#dff3fb").attr("opacity",Math.max(.25,1-frac*0.15));
  bergSvg.append("path").attr("d",d).attr("fill","none").attr("stroke","#9fd8ea").attr("stroke-width",1.2);
  // dryp naar den smelter meget
  if(frac>0.35){
    for(let i=0;i<Math.round(frac*4);i++){
      bergSvg.append("circle").attr("cx",50+i*8).attr("cy",waterY+4+((i*7)%10)).attr("r",1.6).attr("fill","#bfe9ff").attr("opacity",.7);
    }
  }
  bergSvg.append("ellipse").attr("cx",60).attr("cy",waterY).attr("rx",44).attr("ry",4).attr("fill","#bfe9ff").attr("opacity",.25);
}
const CO2_CAP=14000; // "smeltepunkt" for visualiseringen (kg) - fuldt smeltet isbjerg
function updateCO2(ji){
  const kg=co2UpTo(ji);
  co2El.textContent=fmtCO2(kg);
  drawIceberg(Math.min(1,kg/CO2_CAP));
}
function glowCountries(ji){
  const visited=new Set();
  for(let k=0;k<=ji;k++){J[k].stops.forEach(s=>{if(s[3])visited.add(s[3]);});}
  if(!window.__countryFeats)return;
  const hit=window.__countryFeats.filter(f=>window.__nameMatch(f,visited));
  const sel=gGlow.selectAll("path").data(hit, d=>d.properties.name);
  sel.enter().append("path").attr("class","country-glow").attr("d",path).attr("opacity",0)
    .merge(sel)
    .transition().duration(400).attr("opacity",.8);
  sel.exit().remove();
  // Mikro-territorier findes ikke som polygoner i 110m-kortet - marker dem som lysende prikker i stedet
  const microHits=Object.keys(window.__MICRO_DOTS).filter(n=>visited.has(n));
  const dotSel=gGlow.selectAll("circle.micro-glow").data(microHits, d=>d);
  dotSel.enter().append("circle").attr("class","micro-glow")
    .attr("cx",d=>proj(window.__MICRO_DOTS[d])[0]).attr("cy",d=>proj(window.__MICRO_DOTS[d])[1])
    .attr("r",0).attr("fill","#5a9e7c").attr("stroke","#7ec4a3").attr("stroke-width",.7).attr("opacity",0)
    .merge(dotSel)
    .transition().duration(400).attr("r",4.5).attr("opacity",.85);
  dotSel.exit().remove();
}

function homeDot(){const [hx,hy]=proj(HOME);gHome.selectAll("*").remove();
  gHome.append("circle").attr("class","home").attr("cx",hx).attr("cy",hy).attr("r",4.5);}
function drawArc(from,to,cls,color){const line={type:"LineString",coordinates:[from,to]};
  return gArc.append("path").attr("class","arc "+cls).attr("d",path(line)).attr("stroke",color);}
function drawPin(lng,lat,color,animate,old){const [x,y]=proj([lng,lat]);
  const c=gPin.append("circle").attr("class","pin"+(old?" old":"")).attr("cx",x).attr("cy",y).attr("fill",color).attr("r",old?2.8:0);
  if(!old)c.transition().duration(animate?200:0).ease(d3.easeBackOut).attr("r",5);}
function countUpTo(ji){const seen=new Set();let trips=0;
  for(let k=0;k<=ji;k++){if(J[k].y>=2004)trips++;J[k].stops.forEach(s=>seen.add(s[3]||s[0]));}
  cTrips.textContent=trips;cCountries.textContent=seen.size;updateCO2(ji);glowCountries(ji);}
function hud(J0,col){yearEl.textContent=J0.y<2004?"Før 2004":J0.y;
  placeEl.textContent=J0.name;placeEl.style.color=col;
  whoEl.textContent=J0.hvem.toUpperCase();whoEl.style.color=col;monthEl.textContent=J0.m||"";}

function drawStatic(target){
  gArc.selectAll("*").remove();gPin.selectAll("*").remove();gLbl.selectAll("*").remove();gPlane.selectAll("*").remove();
  for(let ji=0;ji<=target;ji++){const J0=J[ji];const col=COL[J0.hvem]||COL["Fælles"];const last=(ji===target);
    let prev=HOME;
    J0.stops.forEach(st=>{const dest=[st[1],st[2]];drawArc(prev,dest,last?"":"old",col);drawPin(st[1],st[2],col,false,!last);prev=dest;});
    drawArc(prev,HOME,last?"ret":"old",col);
    if(last){const s0=J0.stops[0];const [x,y]=proj([s0[1],s0[2]]);
      gLbl.append("text").attr("class","lbl").attr("x",x+8).attr("y",y+4).text(J0.name.split(" → ")[0]);hud(J0,col);}
  }
  homeDot();countUpTo(target);scrub.value=target;idx=target;
}
function drawBase(ji){
  gArc.selectAll("*").remove();gPin.selectAll("*").remove();gLbl.selectAll("*").remove();gPlane.selectAll("*").remove();
  for(let k=0;k<ji;k++){const J0=J[k];const col=COL[J0.hvem]||COL["Fælles"];let prev=HOME;
    J0.stops.forEach(st=>{const dest=[st[1],st[2]];drawArc(prev,dest,"old",col);drawPin(st[1],st[2],col,false,true);prev=dest;});
    drawArc(prev,HOME,"old",col);}
  homeDot();
}
function legDur(from,to){const d=d3.geoDistance(from,to)*180/Math.PI;
  return (Math.min(650,Math.max(420,d*3.4)))*SPD;}
function animateLeg(from,to,isReturn,col,done){
  const p=drawArc(from,to,isReturn?"ret":"",col);
  const L=p.node().getTotalLength();const dur=legDur(from,to);
  const plane=gPlane.append("text").attr("class","plane").text("✈️").attr("opacity",.9);
  p.attr("stroke-dasharray",L).attr("stroke-dashoffset",L)
   .transition().duration(dur).ease(d3.easeCubicInOut).attr("stroke-dashoffset",0)
   .tween("pl",()=>t=>{const pt=p.node().getPointAtLength(L*t);plane.attr("x",pt.x-6).attr("y",pt.y+5);})
   .on("end",()=>{plane.remove();done&&done();});
}
function playJourney(ji){
  if(!playing)return;
  if(ji>=J.length){stop();return;}
  idx=ji;scrub.value=ji;drawBase(ji);
  const J0=J[ji];const col=COL[J0.hvem]||COL["Fælles"];hud(J0,col);countUpTo(ji);
  const s0=J0.stops[0];const [lx,ly]=proj([s0[1],s0[2]]);
  gLbl.append("text").attr("class","lbl lbl-live").attr("x",lx+8).attr("y",ly+4).text(s0[0])
    .attr("opacity",0).transition().duration(180).attr("opacity",1);
  const pts=[HOME,...J0.stops.map(s=>[s[1],s[2]]),HOME];
  let li=0;
  function nextLeg(){
    if(!playing)return;
    if(li>=pts.length-1){pending=setTimeout(()=>playJourney(ji+1),320*SPD);return;}
    const isRet=(li===pts.length-2);
    animateLeg(pts[li],pts[li+1],isRet,col,()=>{
      if(!isRet){
        drawPin(pts[li+1][0],pts[li+1][1],col,true,false);
        const stopName=J0.stops[li] ? J0.stops[li][0] : "";
        if(stopName){
          gLbl.selectAll("text.lbl-live").remove();
          const [lx2,ly2]=proj(pts[li+1]);
          gLbl.append("text").attr("class","lbl lbl-live").attr("x",lx2+8).attr("y",ly2+4).text(stopName)
            .attr("opacity",0).transition().duration(150).attr("opacity",1);
        }
      }
      li++;pending=setTimeout(nextLeg,180*SPD);
    });
  }
  nextLeg();
}
function play(){if(playing)return;playing=true;playBtn.textContent="⏸ Pause";
  if(idx>=J.length-1)idx=0;playJourney(idx);}
function stop(){playing=false;playBtn.textContent="▶ Afspil";
  if(pending){clearTimeout(pending);pending=null;}svg.selectAll("*").interrupt();gPlane.selectAll("*").remove();}
playBtn.onclick=()=>playing?stop():play();
restartBtn.onclick=()=>{stop();idx=0;drawStatic(0);};
scrub.oninput=()=>{stop();drawStatic(+scrub.value);};
d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world=>{
  const feats=topojson.feature(world,world.objects.countries).features.filter(f=>f.properties.name!=="Antarctica");
  gLand.selectAll("path").data(feats).join("path").attr("class","land").attr("d",path);
  window.__countryFeats=feats;
  drawStatic(0);drawIceberg(0);setTimeout(play,500);
}).catch(()=>{document.getElementById("place").textContent="Kunne ikke hente kortdata – prøv at genindlæse.";});
</script>
